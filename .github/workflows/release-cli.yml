name: Release CLI Binaries

# Builds KiduCode CLI for all platforms and uploads binaries to the GitHub Release.
# This enables: curl -fsSL https://kiducode.com/install | bash

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            target_arch: x64
          - os: ubuntu-24.04-arm
            target_os: linux
            target_arch: arm64
          - os: macos-latest
            target_os: darwin
            target_arch: arm64
          - os: macos-13
            target_os: darwin
            target_arch: x64
          - os: windows-latest
            target_os: windows
            target_arch: x64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target_os }}-${{ matrix.target_arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (tag: $TAG)"

      - name: Build, Package, and Upload CLI binary
        shell: bash
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_RELEASE: "1"
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/kiducode
          # Use the native build script to ensure all plugins (like Solid/JSX) run correctly.
          bun run ./script/build.ts --single
